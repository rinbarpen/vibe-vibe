    <text x="630.0" y="946.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">有实质取舍</text>
    <text x="425.0" y="746.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">清单和来源明确</text>
    <text x="425.0" y="346.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">保留目标与工作目录</text>
    <text x="642.0" y="2440.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">记录实际证据与未观察项</text>
    <text x="1280" y="1409.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">修正契约/布局</text>
    <text x="1306" y="938.5" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">真实回答后继续或调整</text>
