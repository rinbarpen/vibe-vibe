    <g id="node-start" data-kind="terminal" data-row="0">
      <title>用户：一句项目目标 — 已有 AI 工具；目标目录保持为用户原始工作目录，不指向来源仓库。</title>
      <rect x="450" y="198" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="222" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="248" font-size="18" font-weight="700">用户：一句项目目标</text>
      <text x="466" y="272" font-size="14" fill="#334155">已有 AI 工具；目标目录保持为用户原始工作目</text>
      <text x="466" y="292" font-size="14" fill="#334155">录，不指向来源仓库。</text>
    </g>
    <g id="node-inspect" data-kind="ai" data-row="1">
      <title>AI：读取项目与系统事实 — 复用既有规则和决定；探测 Git/Python，定位来源、模板和技能；不改全局账号设置。</title>
      <rect x="40" y="398" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="422" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="448" font-size="18" font-weight="700">AI：读取项目与系统事实</text>
      <text x="56" y="472" font-size="14" fill="#334155">复用既有规则和决定；探测 Git/Python，定位来</text>
      <text x="56" y="492" font-size="14" fill="#334155">源、模板和技能；不改全局账号设置。</text>
    </g>
    <g id="node-sources" data-kind="check" data-row="2">
      <title>AI：核验来源和依赖 — 使用真实目录与清单；缺失子模块按需获取；缺依赖不伪造完成。</title>
      <rect x="450" y="598" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="622" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="648" font-size="18" font-weight="700">AI：核验来源和依赖</text>
      <text x="466" y="672" font-size="14" fill="#334155">使用真实目录与清单；缺失子模块按需获取；缺</text>
      <text x="466" y="692" font-size="14" fill="#334155">依赖不伪造完成。</text>
    </g>
    <g id="node-select" data-kind="ai" data-row="3">
      <title>AI：选择或调整业务契约 — 读取完整 manifest 和场景；无适配模板则按 manifest-creator 写业务流程。</title>
      <rect x="40" y="798" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="822" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="848" font-size="18" font-weight="700">AI：选择或调整业务契约</text>
      <text x="56" y="872" font-size="14" fill="#334155">读取完整 manifest 和场景；无适配模板则按 ma</text>
      <text x="56" y="892" font-size="14" fill="#334155">nifest-creator 写业务流程。</text>
    </g>
    <g id="node-decision" data-kind="human" data-row="4">
      <title>用户：决定实质取舍 — 只处理目标冲突、新约束或保留文件的实质差异，不把技术调查交回用户。</title>
      <rect x="860" y="998" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="1022" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="1048" font-size="18" font-weight="700">用户：决定实质取舍</text>
      <text x="876" y="1072" font-size="14" fill="#334155">只处理目标冲突、新约束或保留文件的实质差异</text>
      <text x="876" y="1092" font-size="14" fill="#334155">，不把技术调查交回用户。</text>
      <text x="876" y="1124" font-size="14" fill="#9a3412">介入条件：现有目标矛盾或出现需要人的新业务</text>
      <text x="876" y="1144" font-size="14" fill="#9a3412">取舍。</text>
      <text x="876" y="1164" font-size="14" fill="#9a3412">恢复执行：无答复保存等待；回答后 AI 继续选</text>
      <text x="876" y="1184" font-size="14" fill="#9a3412">择/调整；取消则保留现状。</text>
    </g>
    <g id="node-author" data-kind="ai" data-row="5">
      <title>AI：生成缺少的 manifest — 普通 Markdown 业务契约、条件规则、依赖与验收；workflow 源/SVG/渲染器；不改无关模板。</title>
      <rect x="40" y="1292" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1316" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1342" font-size="18" font-weight="700">AI：生成缺少的 manifest</text>
      <text x="56" y="1366" font-size="14" fill="#334155">普通 Markdown 业务契约、条件规则、依赖与验</text>
      <text x="56" y="1386" font-size="14" fill="#334155">收；workflow 源/SVG/渲染器；不改无关模板。</text>
    </g>
    <g id="node-contract" data-kind="check" data-row="6">
      <title>AI：审查契约与安装布局 — 编译中立规则包，保留作用域与来源；核对链接、图再生；不假设存在宿主工具。</title>
      <rect x="450" y="1492" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1516" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1542" font-size="18" font-weight="700">AI：审查契约与安装布局</text>
      <text x="466" y="1566" font-size="14" fill="#334155">编译中立规则包，保留作用域与来源；核对链接</text>
      <text x="466" y="1586" font-size="14" fill="#334155">、图再生；不假设存在宿主工具。</text>
    </g>
    <g id="node-preview" data-kind="ai" data-row="7">
      <title>AI：Python 暂存与预览 — 不执行 Bash；保留根指令、项目数据与状态，预检所有冲突；dry-run 不写目标。</title>
      <rect x="40" y="1692" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1716" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1742" font-size="18" font-weight="700">AI：Python 暂存与预览</text>
      <text x="56" y="1766" font-size="14" fill="#334155">不执行 Bash；保留根指令、项目数据与状态，预</text>
      <text x="56" y="1786" font-size="14" fill="#334155">检所有冲突；dry-run 不写目标。</text>
    </g>
    <g id="node-gate" data-kind="check" data-row="8">
      <title>AI：核对预览和既有文件 — 缺依赖/冲突先处理，不静默覆盖；默认不 push、上云、安装模型或登录账号。</title>
      <rect x="450" y="1892" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1916" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1942" font-size="18" font-weight="700">AI：核对预览和既有文件</text>
      <text x="466" y="1966" font-size="14" fill="#334155">缺依赖/冲突先处理，不静默覆盖；默认不 push</text>
      <text x="466" y="1986" font-size="14" fill="#334155">、上云、安装模型或登录账号。</text>
    </g>
    <g id="node-install" data-kind="ai" data-row="9">
      <title>AI：事务安装项目上下文 — PROJECT_RULES + 普通规则 + 完整技能；命名宿主入口可选；保留原内容，备份并核对。</title>
      <rect x="40" y="2092" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="2116" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="2142" font-size="18" font-weight="700">AI：事务安装项目上下文</text>
      <text x="56" y="2166" font-size="14" fill="#334155">PROJECT_RULES + 普通规则 + 完整技能；命名宿</text>
      <text x="56" y="2186" font-size="14" fill="#334155">主入口可选；保留原内容，备份并核对。</text>
    </g>
    <g id="node-rollback" data-kind="ai" data-row="10">
      <title>AI：自动回退并核对 — 应用失败由原事务恢复；保留诊断；修复后重新预览，不能把失败当成功。</title>
      <rect x="40" y="2292" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="2316" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="2342" font-size="18" font-weight="700">AI：自动回退并核对</text>
      <text x="56" y="2366" font-size="14" fill="#334155">应用失败由原事务恢复；保留诊断；修复后重新</text>
      <text x="56" y="2386" font-size="14" fill="#334155">预览，不能把失败当成功。</text>
    </g>
    <g id="node-verify" data-kind="check" data-row="10">
      <title>AI：文件与宿主验收 — 执行 --check 与规则/场景验收；宿主显式读规则或实际发现，未观察项单列。</title>
      <rect x="450" y="2292" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="2316" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="2342" font-size="18" font-weight="700">AI：文件与宿主验收</text>
      <text x="466" y="2366" font-size="14" fill="#334155">执行 --check 与规则/场景验收；宿主显式读规</text>
      <text x="466" y="2386" font-size="14" fill="#334155">则或实际发现，未观察项单列。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="11">
      <title>交付配置，继续原始任务 — 交付路径、验证、未观察项与回退；成功后登记真实项目，索引失败仅警告，不把配置就绪当业务完成。</title>
      <rect x="450" y="2492" width="360" height="134" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="2516" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="2542" font-size="18" font-weight="700">交付配置，继续原始任务</text>
      <text x="466" y="2566" font-size="14" fill="#334155">交付路径、验证、未观察项与回退；成功后登记</text>
      <text x="466" y="2586" font-size="14" fill="#334155">真实项目，索引失败仅警告，不把配置就绪当业</text>
      <text x="466" y="2606" font-size="14" fill="#334155">务完成。</text>
    </g>
    <text x="425.0" y="1440.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">审查新契约与图</text>
    <text x="425.0" y="1640.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">确定参数和依赖</text>
    <text x="835.0" y="1240.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">取消：保留现状并交接</text>
