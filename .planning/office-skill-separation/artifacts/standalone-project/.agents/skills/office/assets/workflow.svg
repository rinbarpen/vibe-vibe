<svg xmlns="http://www.w3.org/2000/svg" width="1598" height="1688" viewBox="0 0 1598 1688" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Office Skill：可复用办公能力</title>
  <desc id="workflow-description">能力工作流，不表示某次任务已经运行或获得用户决定。 设计规范示意，不代表实时运行状态。左侧 AI 执行，中间 AI 判定与校验，右侧人工决策；橙色虚线表示返工。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="rework-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker></defs>
  <g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif" fill="#0f172a">
    <rect width="1598" height="1688" fill="#ffffff"/>
    <text x="28" y="38" font-size="26" font-weight="700">Office Skill：可复用办公能力</text>
    <text x="28" y="70" font-size="14" fill="#475569">能力工作流，不表示某次任务已经运行或获得用户决定。</text>
    <text x="28" y="94" font-size="13" fill="#64748b">设计规范 · 静态流程示意，不代表执行状态 · 实线：正常流转；橙色虚线：返工</text>
    <rect x="20" y="128" width="400" height="1494" rx="14" fill="#f8faff" stroke="#e2e8f0"/>
    <text x="220" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 自主执行</text>
    <rect x="430" y="128" width="400" height="1494" rx="14" fill="#f6fbf9" stroke="#e2e8f0"/>
    <text x="630" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 判定 / 校验与起止</text>
    <rect x="840" y="128" width="400" height="1494" rx="14" fill="#fffbf5" stroke="#e2e8f0"/>
    <text x="1040" y="157" text-anchor="middle" font-size="16" font-weight="700">人工决策门</text>
    <path data-from="build" data-to="check" d="M 220.0,966 V 1009.0 H 630.0 V 1052" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="check" data-to="qa" d="M 630.0,1166 V 1209.0 H 630.0 V 1252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="build" d="M 1040.0,766 V 809.0 H 220.0 V 852" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="done" d="M 1040.0,766 V 809.0 H 434 V 1428 H 630.0 V 1452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="plan" data-to="build" d="M 220.0,472 V 515.0 H 220.0 V 852" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="plan" data-to="decision" d="M 220.0,472 V 515.0 H 1040.0 V 558" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="qa" data-to="done" d="M 630.0,1366 V 1409.0 H 630.0 V 1452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="start" data-to="plan" d="M 630.0,272 V 315.0 H 220.0 V 358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="check" data-to="build" d="M 810,1109.0 H 1270 V 829 H 220.0 V 852" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="decision" data-to="plan" d="M 1220,662.0 H 1296 V 335 H 220.0 V 358" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="qa" data-to="build" d="M 810,1309.0 H 1322 V 829 H 220.0 V 852" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <g id="node-start" data-kind="terminal" data-row="0">
      <title>办公文件任务 — 复用本次目标、原稿与已确认约束。</title>
      <rect x="450" y="178" width="360" height="94" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="202" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="228" font-size="18" font-weight="700">办公文件任务</text>
      <text x="466" y="252" font-size="14" fill="#334155">复用本次目标、原稿与已确认约束。</text>
    </g>
    <g id="node-plan" data-kind="ai" data-row="1">
      <title>Office：选择实际能力 — 按需路由写作、Omnidraw、Omnisheet、Omnippt及格式引擎；同一文件唯一写入者。</title>
      <rect x="40" y="358" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="382" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="408" font-size="18" font-weight="700">Office：选择实际能力</text>
      <text x="56" y="432" font-size="14" fill="#334155">按需路由写作、Omnidraw、Omnisheet、Omnippt</text>
      <text x="56" y="452" font-size="14" fill="#334155">及格式引擎；同一文件唯一写入者。</text>
    </g>
    <g id="node-decision" data-kind="human" data-row="2">
      <title>用户决定变化部分 — 仅当目标变化、宏或图表选择等约定门尚未确认时等待；独立工作继续。</title>
      <rect x="860" y="558" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="582" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="608" font-size="18" font-weight="700">用户决定变化部分</text>
      <text x="876" y="632" font-size="14" fill="#334155">仅当目标变化、宏或图表选择等约定门尚未确认</text>
      <text x="876" y="652" font-size="14" fill="#334155">时等待；独立工作继续。</text>
      <text x="876" y="684" font-size="14" fill="#9a3412">介入条件：缺少会改变产物的业务选择；复用已</text>
      <text x="876" y="704" font-size="14" fill="#9a3412">有有效决定。</text>
      <text x="876" y="724" font-size="14" fill="#9a3412">恢复执行：继续返回制作；调整回计划；取消本</text>
      <text x="876" y="744" font-size="14" fill="#9a3412">项保留原件与记录。</text>
    </g>
    <g id="node-build" data-kind="ai" data-row="3">
      <title>制作或局部修复 — 正文、素材、原生表格与格式工程按已确认来源装配；保留工作副本与编辑源。</title>
      <rect x="40" y="852" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="876" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="902" font-size="18" font-weight="700">制作或局部修复</text>
      <text x="56" y="926" font-size="14" fill="#334155">正文、素材、原生表格与格式工程按已确认来源</text>
      <text x="56" y="946" font-size="14" fill="#334155">装配；保留工作副本与编辑源。</text>
    </g>
    <g id="node-check" data-kind="check" data-row="4">
      <title>结构、原生功能与全量视觉 — 核对内容、数值、宏实际状态、页面/工作表覆盖和输入/最终哈希。</title>
      <rect x="450" y="1052" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1076" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1102" font-size="18" font-weight="700">结构、原生功能与全量视觉</text>
      <text x="466" y="1126" font-size="14" fill="#334155">核对内容、数值、宏实际状态、页面/工作表覆盖</text>
      <text x="466" y="1146" font-size="14" fill="#334155">和输入/最终哈希。</text>
    </g>
    <g id="node-qa" data-kind="check" data-row="5">
      <title>独立 Office QA — 另一审查者读取最终文件与证据；缺条件保持 pending，问题回制作人。</title>
      <rect x="450" y="1252" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1276" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1302" font-size="18" font-weight="700">独立 Office QA</text>
      <text x="466" y="1326" font-size="14" fill="#334155">另一审查者读取最终文件与证据；缺条件保持 pe</text>
      <text x="466" y="1346" font-size="14" fill="#334155">nding，问题回制作人。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="6">
      <title>成品与证据交付 — 仅当前版本全部适用验收有证据时 passed；否则明确未决项，不伪造验证。</title>
      <rect x="450" y="1452" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="1476" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="1502" font-size="18" font-weight="700">成品与证据交付</text>
      <text x="466" y="1526" font-size="14" fill="#334155">仅当前版本全部适用验收有证据时 passed；否则</text>
      <text x="466" y="1546" font-size="14" fill="#334155">明确未决项，不伪造验证。</text>
    </g>
    <text x="425.0" y="1000.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">真实产物与执行记录</text>
    <text x="425.0" y="1000.0" text-anchor="middle" font-size="12" fill="#64748b">真实产物与执行记录</text>
    <text x="642.0" y="1200.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">检查与覆盖证据齐备</text>
    <text x="642.0" y="1200.0" text-anchor="start" font-size="12" fill="#64748b">检查与覆盖证据齐备</text>
    <text x="630.0" y="800.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">继续：有效决定</text>
    <text x="630.0" y="800.0" text-anchor="middle" font-size="12" fill="#64748b">继续：有效决定</text>
    <text x="835.0" y="800.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">取消本项：保留记录</text>
    <text x="835.0" y="800.0" text-anchor="middle" font-size="12" fill="#64748b">取消本项：保留记录</text>
    <text x="232.0" y="506.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">条件齐备</text>
    <text x="232.0" y="506.0" text-anchor="start" font-size="12" fill="#64748b">条件齐备</text>
    <text x="630.0" y="506.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">本次必要决定待确认</text>
    <text x="630.0" y="506.0" text-anchor="middle" font-size="12" fill="#64748b">本次必要决定待确认</text>
    <text x="642.0" y="1400.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">通过或明确 pending</text>
    <text x="642.0" y="1400.0" text-anchor="start" font-size="12" fill="#64748b">通过或明确 pending</text>
    <text x="425.0" y="306.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">复用已知输入</text>
    <text x="425.0" y="306.0" text-anchor="middle" font-size="12" fill="#64748b">复用已知输入</text>
    <text x="1280" y="969.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">检查失败：原制作人修复</text>
    <text x="1280" y="969.0" text-anchor="start" font-size="12" fill="#c2410c">检查失败：原制作人修复</text>
    <text x="1306" y="498.5" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">调整约束</text>
    <text x="1306" y="498.5" text-anchor="start" font-size="12" fill="#c2410c">调整约束</text>
    <text x="1332" y="1069.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">发现问题：修复并复验</text>
    <text x="1332" y="1069.0" text-anchor="start" font-size="12" fill="#c2410c">发现问题：修复并复验</text>
    <text x="28" y="1662" font-size="12" fill="#64748b">schema_version: 1 · 人工节点必须定义介入条件与恢复位置 · 修改 JSON 后重新生成并执行 --check</text>
  </g>
</svg>
