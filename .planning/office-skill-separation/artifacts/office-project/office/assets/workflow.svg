<svg xmlns="http://www.w3.org/2000/svg" width="1572" height="1708" viewBox="0 0 1572 1708" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">办公项目 Manifest：业务协作契约</title>
  <desc id="workflow-description">项目工作方式与通用 Office 能力分层；图只描述规则，不代表实际进度。 设计规范示意，不代表实时运行状态。左侧 AI 执行，中间 AI 判定与校验，右侧人工决策；橙色虚线表示返工。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="rework-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker></defs>
  <g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif" fill="#0f172a">
    <rect width="1572" height="1708" fill="#ffffff"/>
    <text x="28" y="38" font-size="26" font-weight="700">办公项目 Manifest：业务协作契约</text>
    <text x="28" y="70" font-size="14" fill="#475569">项目工作方式与通用 Office 能力分层；图只描述规则，不代表实际进度。</text>
    <text x="28" y="94" font-size="13" fill="#64748b">设计规范 · 静态流程示意，不代表执行状态 · 实线：正常流转；橙色虚线：返工</text>
    <rect x="20" y="128" width="400" height="1514" rx="14" fill="#f8faff" stroke="#e2e8f0"/>
    <text x="220" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 自主执行</text>
    <rect x="430" y="128" width="400" height="1514" rx="14" fill="#f6fbf9" stroke="#e2e8f0"/>
    <text x="630" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 判定 / 校验与起止</text>
    <rect x="840" y="128" width="400" height="1514" rx="14" fill="#fffbf5" stroke="#e2e8f0"/>
    <text x="1040" y="157" text-anchor="middle" font-size="16" font-weight="700">人工决策门</text>
    <path data-from="archive" data-to="done" d="M 220.0,1386 V 1429.0 H 630.0 V 1472" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="brief" data-to="decision" d="M 220.0,492 V 535.0 H 1040.0 V 578" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="brief" data-to="office" d="M 220.0,492 V 535.0 H 220.0 V 872" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="archive" d="M 1040.0,786 V 829.0 H 24 V 1248 H 220.0 V 1272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="office" d="M 1040.0,786 V 829.0 H 220.0 V 872" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="office" data-to="review" d="M 220.0,986 V 1029.0 H 630.0 V 1072" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="review" data-to="archive" d="M 630.0,1186 V 1229.0 H 220.0 V 1272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="start" data-to="brief" d="M 630.0,292 V 335.0 H 220.0 V 378" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="brief" d="M 1220,682.0 H 1270 V 355 H 220.0 V 378" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="review" data-to="office" d="M 810,1129.0 H 1296 V 849 H 220.0 V 872" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <g id="node-start" data-kind="terminal" data-row="0">
      <title>办公项目需求 — 报告、会议材料、方案或跨格式交付；保留既有项目内容。</title>
      <rect x="450" y="178" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="202" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="228" font-size="18" font-weight="700">办公项目需求</text>
      <text x="466" y="252" font-size="14" fill="#334155">报告、会议材料、方案或跨格式交付；保留既有</text>
      <text x="466" y="272" font-size="14" fill="#334155">项目内容。</text>
    </g>
    <g id="node-brief" data-kind="ai" data-row="1">
      <title>项目目标与材料版本 — 整理受众、交付清单、来源、模板/样文、负责人及验收范围；复用已有简报。</title>
      <rect x="40" y="378" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="402" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="428" font-size="18" font-weight="700">项目目标与材料版本</text>
      <text x="56" y="452" font-size="14" fill="#334155">整理受众、交付清单、来源、模板/样文、负责人</text>
      <text x="56" y="472" font-size="14" fill="#334155">及验收范围；复用已有简报。</text>
    </g>
    <g id="node-decision" data-kind="human" data-row="2">
      <title>业务决策与范围确认 — 仅处理新目标、约束冲突、对外发布等已约定门；不接管常规实现。</title>
      <rect x="860" y="578" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="602" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="628" font-size="18" font-weight="700">业务决策与范围确认</text>
      <text x="876" y="652" font-size="14" fill="#334155">仅处理新目标、约束冲突、对外发布等已约定门</text>
      <text x="876" y="672" font-size="14" fill="#334155">；不接管常规实现。</text>
      <text x="876" y="704" font-size="14" fill="#9a3412">介入条件：新业务取舍或约定的高影响门；已确</text>
      <text x="876" y="724" font-size="14" fill="#9a3412">认范围直接进入制作。</text>
      <text x="876" y="744" font-size="14" fill="#9a3412">恢复执行：继续交 Office；调整返回简报；取消</text>
      <text x="876" y="764" font-size="14" fill="#9a3412">保留原件并归档本次状态。</text>
    </g>
    <g id="node-office" data-kind="ai" data-row="3">
      <title>调用 Office 技能制作 — 通用写作、图表、格式、宏与检查由 office 及配套 Skills 实现；项目不复制实现。</title>
      <rect x="40" y="872" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="896" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="922" font-size="18" font-weight="700">调用 Office 技能制作</text>
      <text x="56" y="946" font-size="14" fill="#334155">通用写作、图表、格式、宏与检查由 office 及</text>
      <text x="56" y="966" font-size="14" fill="#334155">配套 Skills 实现；项目不复制实现。</text>
    </g>
    <g id="node-review" data-kind="check" data-row="4">
      <title>项目验收与版本核对 — 复用 Office 独立 QA，核对跨格式口径、交付清单和当前版本哈希。</title>
      <rect x="450" y="1072" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1096" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1122" font-size="18" font-weight="700">项目验收与版本核对</text>
      <text x="466" y="1146" font-size="14" fill="#334155">复用 Office 独立 QA，核对跨格式口径、交付清</text>
      <text x="466" y="1166" font-size="14" fill="#334155">单和当前版本哈希。</text>
    </g>
    <g id="node-archive" data-kind="ai" data-row="5">
      <title>归档与交付登记 — 在既有 MANIFEST.md 登记成品、证据、未决项与用户反馈；修订另存版本。</title>
      <rect x="40" y="1272" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1296" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1322" font-size="18" font-weight="700">归档与交付登记</text>
      <text x="56" y="1346" font-size="14" fill="#334155">在既有 MANIFEST.md 登记成品、证据、未决项与</text>
      <text x="56" y="1366" font-size="14" fill="#334155">用户反馈；修订另存版本。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="6">
      <title>项目阶段交付 — 仅按任务范围宣告完成；对外发送另按已有业务决定执行。</title>
      <rect x="450" y="1472" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="1496" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="1522" font-size="18" font-weight="700">项目阶段交付</text>
      <text x="466" y="1546" font-size="14" fill="#334155">仅按任务范围宣告完成；对外发送另按已有业务</text>
      <text x="466" y="1566" font-size="14" fill="#334155">决定执行。</text>
    </g>
    <text x="425.0" y="1420.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">登记版本与状态</text>
    <text x="425.0" y="1420.0" text-anchor="middle" font-size="12" fill="#64748b">登记版本与状态</text>
    <text x="630.0" y="526.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">需要新业务决定</text>
    <text x="630.0" y="526.0" text-anchor="middle" font-size="12" fill="#64748b">需要新业务决定</text>
    <text x="232.0" y="526.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">范围已确认</text>
    <text x="232.0" y="526.0" text-anchor="start" font-size="12" fill="#64748b">范围已确认</text>
    <text x="630.0" y="820.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">取消：保留原件与记录</text>
    <text x="630.0" y="820.0" text-anchor="middle" font-size="12" fill="#64748b">取消：保留原件与记录</text>
    <text x="630.0" y="820.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">继续</text>
    <text x="630.0" y="820.0" text-anchor="middle" font-size="12" fill="#64748b">继续</text>
    <text x="425.0" y="1020.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">成品与独立 QA 证据</text>
    <text x="425.0" y="1020.0" text-anchor="middle" font-size="12" fill="#64748b">成品与独立 QA 证据</text>
    <text x="425.0" y="1220.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">通过或明确 pending</text>
    <text x="425.0" y="1220.0" text-anchor="middle" font-size="12" fill="#64748b">通过或明确 pending</text>
    <text x="425.0" y="326.0" text-anchor="middle" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">接收或恢复任务</text>
    <text x="425.0" y="326.0" text-anchor="middle" font-size="12" fill="#64748b">接收或恢复任务</text>
    <text x="1280" y="518.5" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">调整</text>
    <text x="1280" y="518.5" text-anchor="start" font-size="12" fill="#c2410c">调整</text>
    <text x="1306" y="989.0" text-anchor="start" font-size="12" fill="#ffffff" stroke="#ffffff" stroke-width="4" aria-hidden="true">问题清单：局部修复</text>
    <text x="1306" y="989.0" text-anchor="start" font-size="12" fill="#c2410c">问题清单：局部修复</text>
    <text x="28" y="1682" font-size="12" fill="#64748b">schema_version: 1 · 人工节点必须定义介入条件与恢复位置 · 修改 JSON 后重新生成并执行 --check</text>
  </g>
</svg>
