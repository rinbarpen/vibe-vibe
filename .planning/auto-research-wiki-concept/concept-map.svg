<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">从文献积累到研究记忆</title>
<desc id="desc">四阶段能力递进、四类实体反馈、默认主线与可选领域、四项补强方向；保留当前状态、证据限制及默认安装边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#48535B"/></marker></defs>
