<text x="56" y="49" font-size="20" fill="#48535B" font-weight="400" text-anchor="start">ARIS / auto-research</text>
<text x="56" y="112" font-size="44" fill="#1B2429" font-weight="600" text-anchor="start">从文献积累到研究记忆</text>
<text x="56" y="153" font-size="18" fill="#48535B" font-weight="400" text-anchor="start">能力递进，非历史时间线；当前能力与目标分开标注。</text>
