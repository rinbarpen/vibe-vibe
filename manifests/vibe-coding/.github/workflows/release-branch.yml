name: Release Branch

on:
  push:
    branches: ['release/v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release branch, version, and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release/}"
          python3 scripts/version_guard.py check --tag "$TAG"
          if [ -f scripts/ci.sh ]; then sh scripts/ci.sh; fi
          if [ -f scripts/build.sh ]; then sh scripts/build.sh; fi
          echo "Release branch $GITHUB_REF_NAME is ready for signed tag $TAG" >> "$GITHUB_STEP_SUMMARY"
