name: Hotfix

on:
  push:
    branches: ['hotfix/v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check hotfix before tagging
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#hotfix/}"
          python3 scripts/version_guard.py check --tag "$TAG"
          if [ -f scripts/ci.sh ]; then sh scripts/ci.sh; fi
          if [ -f scripts/build.sh ]; then sh scripts/build.sh; fi
          echo "Hotfix validated. Create and push signed tag $TAG from the merged commit." >> "$GITHUB_STEP_SUMMARY"
