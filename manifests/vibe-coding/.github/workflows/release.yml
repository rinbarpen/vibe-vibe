name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/version_guard.py check --tag "$GITHUB_REF_NAME"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      has_dist: ${{ steps.dist.outputs.has_dist }}
    steps:
      - uses: actions/checkout@v4
      - name: Optional project build
        run: |
          if [ -f scripts/build.sh ]; then sh scripts/build.sh; fi
      - id: dist
        run: |
          if [ -d dist ] && find dist -type f -print -quit | grep -q .; then
            echo 'has_dist=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_dist=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.dist.outputs.has_dist == 'true'
        with:
          name: release-dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/version_guard.py notes --tag "$GITHUB_REF_NAME" --output release_notes.md
      - uses: actions/download-artifact@v4
        if: needs.build.outputs.has_dist == 'true'
        with:
          name: release-dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
