name: PR Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?: .+'; then
            echo 'PR title must follow: <type>(<scope>): <description>' >&2
            exit 1
          fi

  size-label:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate PR size
        id: size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGES=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" | awk '{added += $1; removed += $2} END {print added + removed + 0}')
          if [ "$CHANGES" -le 10 ]; then SIZE=xs
          elif [ "$CHANGES" -le 50 ]; then SIZE=s
          elif [ "$CHANGES" -le 200 ]; then SIZE=m
          elif [ "$CHANGES" -le 800 ]; then SIZE=l
          else SIZE=xl; fi
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
      - name: Replace size label
        uses: actions/github-script@v7
        env:
          SIZE: ${{ steps.size.outputs.size }}
        with:
          script: |
            const names = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            for (const label of current) {
              if (names.includes(label.name) && label.name !== `size/${process.env.SIZE}`) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, name: label.name
                });
              }
            }
            if (!current.some(label => label.name === `size/${process.env.SIZE}`)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, labels: [`size/${process.env.SIZE}`]
              });
            }
