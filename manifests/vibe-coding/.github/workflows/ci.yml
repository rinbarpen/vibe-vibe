name: CI

on:
  push:
    branches: [main, 'release/v*', 'hotfix/v*']
  pull_request:
    branches: [main, 'release/v*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version, changelog and project checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE=""
          if [ "$EVENT_NAME" = pull_request ]; then BASE="$PR_BASE"; fi
          if [ "$EVENT_NAME" = push ]; then BASE="$PUSH_BEFORE"; fi
          if [ -n "$BASE" ] && [ "${BASE//0/}" != "" ] && git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            python3 scripts/version_guard.py check --base-ref "$BASE"
          else
            python3 scripts/version_guard.py check
          fi
          if [ -f scripts/ci.sh ]; then sh scripts/ci.sh; fi
