<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="2468" viewBox="0 0 1650 2468" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">面向读者的文档改写与验收</title>
  <desc id="workflow-description">先核实读者任务与事实，再重整信息层级、改写和沿阅读路径验证。结构检查只是证据的一部分；只有新的产品承诺或约束冲突才请求人决定。 设计规范示意，不代表实时运行状态。左侧 AI 执行，中间 AI 判定与校验，右侧人工决策；橙色虚线表示返工。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="rework-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect width="1650" height="2468" fill="#ffffff"/>
    <text x="28" y="38" font-size="26" font-weight="700">面向读者的文档改写与验收</text>
    <text x="28" y="70" font-size="14" fill="#475569">先核实读者任务与事实，再重整信息层级、改写和沿阅读路径验证。结构检查只是证据的一部分；只有新的产品承诺或约束冲突才请求人决定。</text>
    <text x="28" y="94" font-size="13" fill="#64748b">设计规范 · 静态流程示意，不代表执行状态 · 实线：正常流转；橙色虚线：返工</text>
    <rect x="20" y="128" width="400" height="2274" rx="14" fill="#f8faff" stroke="#e2e8f0"/>
    <text x="220" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 自主执行</text>
    <rect x="430" y="128" width="400" height="2274" rx="14" fill="#f6fbf9" stroke="#e2e8f0"/>
    <text x="630" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 判定 / 校验与起止</text>
    <rect x="840" y="128" width="400" height="2274" rx="14" fill="#fffbf5" stroke="#e2e8f0"/>
    <text x="1040" y="157" text-anchor="middle" font-size="16" font-weight="700">人工决策门</text>
    <path data-from="decision" data-to="rollback" d="M 1040.0,966 V 1009.0 H 24 V 1808 H 220.0 V 1832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="wait" d="M 1040.0,966 V 1009.0 H 630.0 V 1052" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="evidence" data-to="done" d="M 220.0,1746 V 1789.0 H 434 V 2208 H 630.0 V 2232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="facts" data-to="decision" d="M 630.0,672 V 715.0 H 1040.0 V 758" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="facts" data-to="write" d="M 630.0,672 V 715.0 H 220.0 V 1232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="restore" data-to="done" d="M 630.0,2146 V 2189.0 H 630.0 V 2232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="review" data-to="evidence" d="M 630.0,1546 V 1589.0 H 220.0 V 1632" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="rollback" data-to="restore" d="M 220.0,1946 V 1989.0 H 630.0 V 2032" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="scope" data-to="facts" d="M 220.0,472 V 515.0 H 630.0 V 558" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="start" data-to="scope" d="M 630.0,272 V 315.0 H 220.0 V 358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="write" data-to="review" d="M 220.0,1346 V 1389.0 H 630.0 V 1432" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="decision" data-to="scope" d="M 1220,862.0 H 1270 V 335 H 220.0 V 358" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="facts" data-to="scope" d="M 810,615.0 H 1296 V 335 H 220.0 V 358" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="restore" data-to="rollback" d="M 810,2089.0 H 1322 V 1809 H 220.0 V 1832" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="review" data-to="write" d="M 810,1489.0 H 1348 V 1209 H 220.0 V 1232" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="wait" data-to="decision" d="M 810,1099.0 H 1374 V 735 H 1040.0 V 758" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <g id="node-start" data-kind="terminal" data-row="0">
      <title>文档修改请求 — 输入：目标读者、当前任务与已有项目约定。</title>
      <rect x="450" y="178" width="360" height="94" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="202" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="228" font-size="18" font-weight="700">文档修改请求</text>
      <text x="466" y="252" font-size="14" fill="#334155">输入：目标读者、当前任务与已有项目约定。</text>
    </g>
    <g id="node-scope" data-kind="ai" data-row="1">
      <title>选定读者任务与入口 — 复用已确认读者任务并保留原文；事实待补时调查实现或运行针对性检查，不重复访谈。</title>
      <rect x="40" y="358" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="382" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="408" font-size="18" font-weight="700">选定读者任务与入口</text>
      <text x="56" y="432" font-size="14" fill="#334155">复用已确认读者任务并保留原文；事实待补时调</text>
      <text x="56" y="452" font-size="14" fill="#334155">查实现或运行针对性检查，不重复访谈。</text>
    </g>
    <g id="node-facts" data-kind="check" data-row="2">
      <title>核实事实与支持范围 — 对照实现、帮助与已有证据；技术疑问先调查，不靠编造补齐。</title>
      <rect x="450" y="558" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="582" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="608" font-size="18" font-weight="700">核实事实与支持范围</text>
      <text x="466" y="632" font-size="14" fill="#334155">对照实现、帮助与已有证据；技术疑问先调查，</text>
      <text x="466" y="652" font-size="14" fill="#334155">不靠编造补齐。</text>
    </g>
    <g id="node-decision" data-kind="human" data-row="4">
      <title>决定新的产品取舍 — 提供冲突、证据、选项与影响，绑定当前文档版本。</title>
      <rect x="860" y="758" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="782" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="808" font-size="18" font-weight="700">决定新的产品取舍</text>
      <text x="876" y="832" font-size="14" fill="#334155">提供冲突、证据、选项与影响，绑定当前文档版</text>
      <text x="876" y="852" font-size="14" fill="#334155">本。</text>
      <text x="876" y="884" font-size="14" fill="#9a3412">介入条件：产品承诺、支持范围或关键约束需要</text>
      <text x="876" y="904" font-size="14" fill="#9a3412">新取舍。</text>
      <text x="876" y="924" font-size="14" fill="#9a3412">恢复执行：同意/调整后核对版本，从读者任务与</text>
      <text x="876" y="944" font-size="14" fill="#9a3412">事实继续；取消执行并验证回退。</text>
    </g>
    <g id="node-wait" data-kind="check" data-row="5">
      <title>等待有效决定 — 未回答不视为同意；仅等待依赖此决定的修改。</title>
      <rect x="450" y="1052" width="360" height="94" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1076" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1102" font-size="18" font-weight="700">等待有效决定</text>
      <text x="466" y="1126" font-size="14" fill="#334155">未回答不视为同意；仅等待依赖此决定的修改。</text>
    </g>
    <g id="node-write" data-kind="ai" data-row="6">
      <title>重整结构并改写 — 首页给第一步与结果，细节按需下沉；不用固定模板与装饰撑篇幅。</title>
      <rect x="40" y="1232" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1256" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1282" font-size="18" font-weight="700">重整结构并改写</text>
      <text x="56" y="1306" font-size="14" fill="#334155">首页给第一步与结果，细节按需下沉；不用固定</text>
      <text x="56" y="1326" font-size="14" fill="#334155">模板与装饰撑篇幅。</text>
    </g>
    <g id="node-review" data-kind="check" data-row="7">
      <title>沿读者路径验证 — 首屏、前提、操作、结果与链接可找到；运行只读结构检查，核对实际命令证据。</title>
      <rect x="450" y="1432" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1456" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1482" font-size="18" font-weight="700">沿读者路径验证</text>
      <text x="466" y="1506" font-size="14" fill="#334155">首屏、前提、操作、结果与链接可找到；运行只</text>
      <text x="466" y="1526" font-size="14" fill="#334155">读结构检查，核对实际命令证据。</text>
    </g>
    <g id="node-evidence" data-kind="ai" data-row="8">
      <title>交付修改与实际证据 — 保留必要信息，更新已有语言版本；说明未验证项，不生成多余完成报告。</title>
      <rect x="40" y="1632" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1656" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1682" font-size="18" font-weight="700">交付修改与实际证据</text>
      <text x="56" y="1706" font-size="14" fill="#334155">保留必要信息，更新已有语言版本；说明未验证</text>
      <text x="56" y="1726" font-size="14" fill="#334155">项，不生成多余完成报告。</text>
    </g>
    <g id="node-rollback" data-kind="ai" data-row="9">
      <title>恢复本次文档改动 — 取消时只恢复本次拥有的修改，不覆盖他人后续编辑。</title>
      <rect x="40" y="1832" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1856" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1882" font-size="18" font-weight="700">恢复本次文档改动</text>
      <text x="56" y="1906" font-size="14" fill="#334155">取消时只恢复本次拥有的修改，不覆盖他人后续</text>
      <text x="56" y="1926" font-size="14" fill="#334155">编辑。</text>
    </g>
    <g id="node-restore" data-kind="check" data-row="10">
      <title>验证恢复状态 — 检查原文、链接与项目状态；恢复失败继续处理，不假称成功。</title>
      <rect x="450" y="2032" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="2056" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="2082" font-size="18" font-weight="700">验证恢复状态</text>
      <text x="466" y="2106" font-size="14" fill="#334155">检查原文、链接与项目状态；恢复失败继续处理</text>
      <text x="466" y="2126" font-size="14" fill="#334155">，不假称成功。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="11">
      <title>交付或取消结束 — 区分文档交付和已验证回退；图表示规则，不是运行记录。</title>
      <rect x="450" y="2232" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="2256" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="2282" font-size="18" font-weight="700">交付或取消结束</text>
      <text x="466" y="2306" font-size="14" fill="#334155">区分文档交付和已验证回退；图表示规则，不是</text>
      <text x="466" y="2326" font-size="14" fill="#334155">运行记录。</text>
    </g>
    <text x="630.0" y="1000.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">取消修改</text>
    <text x="835.0" y="1000.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">尚无有效回答</text>
    <text x="425.0" y="1780.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">如实交付范围与限制</text>
    <text x="835.0" y="706.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">需要新的产品决定</text>
    <text x="425.0" y="706.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">现有约定内执行</text>
    <text x="642.0" y="2180.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">已验证回退</text>
    <text x="425.0" y="1580.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">所选验证通过</text>
    <text x="425.0" y="1980.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">恢复后检查</text>
    <text x="425.0" y="506.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">界定文档与读者</text>
    <text x="425.0" y="306.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">读取已确认需求</text>
    <text x="425.0" y="1380.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">保留项目事实与原文</text>
    <text x="1280" y="598.5" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">同意/调整：核对后恢复</text>
    <text x="1306" y="475.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">事实待补：调查后重验</text>
    <text x="1332" y="1949.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">恢复失败：处理后重验</text>
    <text x="1358" y="1349.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">结构或阅读路径有问题</text>
    <text x="1384" y="917.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">收到真实回答</text>
    <text x="28" y="2442" font-size="12" fill="#64748b">schema_version: 1 · 人工节点必须定义介入条件与恢复位置 · 修改 JSON 后重新生成并执行 --check</text>
  </g>
</svg>
