<svg xmlns="http://www.w3.org/2000/svg" width="1572" height="2148" viewBox="0 0 1572 2148" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">CodeGraph · CLI 优先的代码导航</title>
  <desc id="workflow-description">本图描述规则，不代表执行状态。已有索引时优先查询，未建索引时直接普通检索。是否启用索引由用户决定；导航不修改项目源码，后续代码变更沿用原有回退规则。 设计规范示意，不代表实时运行状态。左侧 AI 执行，中间 AI 判定与校验，右侧人工决策；橙色虚线表示返工。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="rework-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect width="1572" height="2148" fill="#ffffff"/>
    <text x="28" y="38" font-size="26" font-weight="700">CodeGraph · CLI 优先的代码导航</text>
    <text x="28" y="70" font-size="14" fill="#475569">本图描述规则，不代表执行状态。已有索引时优先查询，未建索引时直接普通检索。是否启用索引由用户决定；导航不修改项目源码，后续代码变更沿用原有</text>
    <text x="28" y="90" font-size="14" fill="#475569">回退规则。</text>
    <text x="28" y="114" font-size="13" fill="#64748b">设计规范 · 静态流程示意，不代表执行状态 · 实线：正常流转；橙色虚线：返工</text>
    <rect x="20" y="148" width="400" height="1934" rx="14" fill="#f8faff" stroke="#e2e8f0"/>
    <text x="220" y="177" text-anchor="middle" font-size="16" font-weight="700">AI 自主执行</text>
    <rect x="430" y="148" width="400" height="1934" rx="14" fill="#f6fbf9" stroke="#e2e8f0"/>
    <text x="630" y="177" text-anchor="middle" font-size="16" font-weight="700">AI 判定 / 校验与起止</text>
    <rect x="840" y="148" width="400" height="1934" rx="14" fill="#fffbf5" stroke="#e2e8f0"/>
    <text x="1040" y="177" text-anchor="middle" font-size="16" font-weight="700">人工决策门</text>
    <path data-from="available" data-to="explore" d="M 630.0,512 V 555.0 H 220.0 V 598" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="available" data-to="opt_in" d="M 630.0,512 V 555.0 H 1040.0 V 598" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="available" data-to="unavailable" d="M 630.0,512 V 555.0 H 630.0 V 892" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="explore" data-to="results" d="M 220.0,806 V 849.0 H 434 V 1068 H 630.0 V 1092" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="fallback" data-to="verify" d="M 220.0,1426 V 1469.0 H 630.0 V 1512" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="opt_in" data-to="fallback" d="M 1040.0,806 V 849.0 H 220.0 V 1292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="results" data-to="fallback" d="M 630.0,1206 V 1249.0 H 220.0 V 1292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="results" data-to="verify" d="M 630.0,1206 V 1249.0 H 630.0 V 1512" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="start" data-to="available" d="M 630.0,312 V 355.0 H 630.0 V 398" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="tests" data-to="done" d="M 630.0,1826 V 1869.0 H 630.0 V 1912" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="unavailable" data-to="fallback" d="M 630.0,1006 V 1049.0 H 220.0 V 1292" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="verify" data-to="tests" d="M 630.0,1626 V 1669.0 H 630.0 V 1712" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="opt_in" data-to="available" d="M 1220,702.0 H 1270 V 375 H 630.0 V 398" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <path data-from="tests" data-to="verify" d="M 810,1769.0 H 1296 V 1489 H 630.0 V 1512" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rework-arrow)"/>
    <g id="node-start" data-kind="terminal" data-row="0">
      <title>理解或定位代码 — 输入：代码问题或边界明确的变更。保留原有任务规模与开发流程。</title>
      <rect x="450" y="198" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="222" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="248" font-size="18" font-weight="700">理解或定位代码</text>
      <text x="466" y="272" font-size="14" fill="#334155">输入：代码问题或边界明确的变更。保留原有任</text>
      <text x="466" y="292" font-size="14" fill="#334155">务规模与开发流程。</text>
    </g>
    <g id="node-available" data-kind="check" data-row="1">
      <title>检查索引与 CLI — 检查项目根目录 .codegraph/ 与 codegraph CLI。缺索引默认跳过，不询问、不阻塞。</title>
      <rect x="450" y="398" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="422" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="448" font-size="18" font-weight="700">检查索引与 CLI</text>
      <text x="466" y="472" font-size="14" fill="#334155">检查项目根目录 .codegraph/ 与 codegraph CLI</text>
      <text x="466" y="492" font-size="14" fill="#334155">。缺索引默认跳过，不询问、不阻塞。</text>
    </g>
    <g id="node-explore" data-kind="ai" data-row="2">
      <title>优先查询 CodeGraph CLI — 先执行 codegraph explore，再补充 rg、find 或源码读取。按需使用 node、impact、affected；已有 MCP 仅作补充。</title>
      <rect x="40" y="598" width="360" height="208" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="622" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="648" font-size="18" font-weight="700">优先查询 CodeGraph CLI</text>
      <text x="56" y="672" font-size="14" fill="#334155">先执行 codegraph explore，再补充 rg、find</text>
      <text x="56" y="692" font-size="14" fill="#334155">或源码读取。按需使用 node、impact、affected</text>
      <text x="56" y="712" font-size="14" fill="#334155">；已有 MCP 仅作补充。</text>
    </g>
    <g id="node-opt_in" data-kind="human" data-row="2">
      <title>用户决定是否启用索引 — 仅在用户主动要求启用时等待决定；不推定同意，不自动初始化。</title>
      <rect x="860" y="598" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="622" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="648" font-size="18" font-weight="700">用户决定是否启用索引</text>
      <text x="876" y="672" font-size="14" fill="#334155">仅在用户主动要求启用时等待决定；不推定同意</text>
      <text x="876" y="692" font-size="14" fill="#334155">，不自动初始化。</text>
      <text x="876" y="724" font-size="14" fill="#9a3412">介入条件：An explicit setup request：用户主</text>
      <text x="876" y="744" font-size="14" fill="#9a3412">动要求启用索引。</text>
      <text x="876" y="764" font-size="14" fill="#9a3412">恢复执行：用户启用后重新检查；用户跳过则继</text>
      <text x="876" y="784" font-size="14" fill="#9a3412">续普通检索。</text>
    </g>
    <g id="node-unavailable" data-kind="check" data-row="3">
      <title>无索引或缺少 CLI — 仅确认普通检索分支，不安装工具、不创建索引、不等待用户设置。</title>
      <rect x="450" y="892" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="916" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="942" font-size="18" font-weight="700">无索引或缺少 CLI</text>
      <text x="466" y="966" font-size="14" fill="#334155">仅确认普通检索分支，不安装工具、不创建索引</text>
      <text x="466" y="986" font-size="14" fill="#334155">、不等待用户设置。</text>
    </g>
    <g id="node-results" data-kind="check" data-row="4">
      <title>检查查询结果 — 查询是否成功、上下文是否充分？空结果不代表没有实现或测试。</title>
      <rect x="450" y="1092" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1116" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1142" font-size="18" font-weight="700">检查查询结果</text>
      <text x="466" y="1166" font-size="14" fill="#334155">查询是否成功、上下文是否充分？空结果不代表</text>
      <text x="466" y="1186" font-size="14" fill="#334155">没有实现或测试。</text>
    </g>
    <g id="node-fallback" data-kind="ai" data-row="5">
      <title>继续针对性普通检索 — 使用 rg 和文件读取。CLI 缺失、查询失败或结果不足时简述局限；不自动安装、重建索引或修改全局配置。</title>
      <rect x="40" y="1292" width="360" height="134" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1316" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1342" font-size="18" font-weight="700">继续针对性普通检索</text>
      <text x="56" y="1366" font-size="14" fill="#334155">使用 rg 和文件读取。CLI 缺失、查询失败或结</text>
      <text x="56" y="1386" font-size="14" fill="#334155">果不足时简述局限；不自动安装、重建索引或修</text>
      <text x="56" y="1406" font-size="14" fill="#334155">改全局配置。</text>
    </g>
    <g id="node-verify" data-kind="check" data-row="6">
      <title>核对当前源码与差异 — 核实实现、调用关系和行为边界。图谱仅作发现线索；有证据缺口时继续调查。</title>
      <rect x="450" y="1512" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1536" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1562" font-size="18" font-weight="700">核对当前源码与差异</text>
      <text x="466" y="1586" font-size="14" fill="#334155">核实实现、调用关系和行为边界。图谱仅作发现</text>
      <text x="466" y="1606" font-size="14" fill="#334155">线索；有证据缺口时继续调查。</text>
    </g>
    <g id="node-tests" data-kind="check" data-row="7">
      <title>验证证据与相关测试 — 代码变更运行相应实际测试；代码问答核对源码。保留既有质量门禁，不新增验收阶段。</title>
      <rect x="450" y="1712" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1736" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1762" font-size="18" font-weight="700">验证证据与相关测试</text>
      <text x="466" y="1786" font-size="14" fill="#334155">代码变更运行相应实际测试；代码问答核对源码</text>
      <text x="466" y="1806" font-size="14" fill="#334155">。保留既有质量门禁，不新增验收阶段。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="8">
      <title>带验证证据返回原任务 — 输出路径、符号、关系、验证结果与剩余局限，继续既有开发流程。</title>
      <rect x="450" y="1912" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="1936" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="1962" font-size="18" font-weight="700">带验证证据返回原任务</text>
      <text x="466" y="1986" font-size="14" fill="#334155">输出路径、符号、关系、验证结果与剩余局限，</text>
      <text x="466" y="2006" font-size="14" fill="#334155">继续既有开发流程。</text>
    </g>
    <text x="425.0" y="546.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">索引与 CLI 均可用</text>
    <text x="835.0" y="546.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">仅用户主动要求设置</text>
    <text x="642.0" y="546.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">缺索引或 CLI</text>
    <text x="425.0" y="840.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">检查返回结果</text>
    <text x="425.0" y="1460.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">找到相关上下文</text>
    <text x="630.0" y="840.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">用户跳过</text>
    <text x="425.0" y="1240.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">失败或结果不足</text>
    <text x="642.0" y="1240.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">上下文充分</text>
    <text x="642.0" y="346.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">需要代码上下文</text>
    <text x="642.0" y="1860.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">相应验证通过</text>
    <text x="425.0" y="1040.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">直接继续普通检索</text>
    <text x="642.0" y="1660.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">校验行为与证据</text>
    <text x="1280" y="538.5" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">用户启用后重查</text>
    <text x="1306" y="1629.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">证据不足或测试失败：调</text>
    <text x="1306" y="1646.0" text-anchor="start" font-size="12" fill="#c2410c" stroke="#ffffff" stroke-width="4" paint-order="stroke">查返工</text>
    <text x="28" y="2122" font-size="12" fill="#64748b">schema_version: 1 · 人工节点必须定义介入条件与恢复位置 · 修改 JSON 后重新生成并执行 --check</text>
  </g>
</svg>
