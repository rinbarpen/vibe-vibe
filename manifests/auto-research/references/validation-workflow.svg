    <g id="node-start" data-kind="terminal" data-row="0">
      <title>进入或恢复当前研究 — 读取已确认目标、方法/claim、源证据、负结果与可信 checkpoint。</title>
      <rect x="450" y="178" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="202" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="228" font-size="18" font-weight="700">进入或恢复当前研究</text>
      <text x="466" y="252" font-size="14" fill="#334155">读取已确认目标、方法/claim、源证据、负结果</text>
      <text x="466" y="272" font-size="14" fill="#334155">与可信 checkpoint。</text>
    </g>
    <g id="node-context" data-kind="check" data-row="1">
      <title>AI：核对语义与版本基线 — 核对 ID/revision/hash、目标与标准、有效决定及真实进程；每轮和上下文切换均执行。</title>
      <rect x="450" y="378" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="402" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="428" font-size="18" font-weight="700">AI：核对语义与版本基线</text>
      <text x="466" y="452" font-size="14" fill="#334155">核对 ID/revision/hash、目标与标准、有效决定</text>
      <text x="466" y="472" font-size="14" fill="#334155">及真实进程；每轮和上下文切换均执行。</text>
    </g>
    <g id="node-restore" data-kind="ai" data-row="2">
      <title>AI：重建并复核可信上下文 — 冲突时保留 attempt，从可信 checkpoint 与原始证据重建；版本、语义和状态复核一致后再继续。</title>
      <rect x="40" y="578" width="360" height="134" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="602" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="628" font-size="18" font-weight="700">AI：重建并复核可信上下文</text>
      <text x="56" y="652" font-size="14" fill="#334155">冲突时保留 attempt，从可信 checkpoint 与原</text>
      <text x="56" y="672" font-size="14" fill="#334155">始证据重建；版本、语义和状态复核一致后再继</text>
      <text x="56" y="692" font-size="14" fill="#334155">续。</text>
    </g>
    <g id="node-novelty" data-kind="check" data-row="3">
      <title>AI：思路与关键方法比较 — 原始方法证据逐项核对；high_overlap / distinct / unverified；方法修订后重验。</title>
      <rect x="450" y="798" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="822" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="848" font-size="18" font-weight="700">AI：思路与关键方法比较</text>
      <text x="466" y="872" font-size="14" fill="#334155">原始方法证据逐项核对；high_overlap / distin</text>
      <text x="466" y="892" font-size="14" fill="#334155">ct / unverified；方法修订后重验。</text>
    </g>
    <g id="node-retrieve" data-kind="ai" data-row="4">
      <title>AI：补文献与方法证据 — 缺证据回 literature/position；关键词只召回，不凭相似或未检出作结论。</title>
      <rect x="40" y="998" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1022" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1048" font-size="18" font-weight="700">AI：补文献与方法证据</text>
      <text x="56" y="1072" font-size="14" fill="#334155">缺证据回 literature/position；关键词只召回</text>
      <text x="56" y="1092" font-size="14" fill="#334155">，不凭相似或未检出作结论。</text>
    </g>
    <g id="node-decision" data-kind="human" data-row="5">
      <title>用户：沿用既有决策门 — 沿用方案选择与目标/预算变更门；不是每轮技术修复都重新审批。</title>
      <rect x="860" y="1198" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="1222" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="1248" font-size="18" font-weight="700">用户：沿用既有决策门</text>
      <text x="876" y="1272" font-size="14" fill="#334155">沿用方案选择与目标/预算变更门；不是每轮技术</text>
      <text x="876" y="1292" font-size="14" fill="#334155">修复都重新审批。</text>
      <text x="876" y="1324" font-size="14" fill="#9a3412">介入条件：首次候选方案选择，或需要改变已确</text>
      <text x="876" y="1344" font-size="14" fill="#9a3412">认目标、约束或预算。</text>
      <text x="876" y="1364" font-size="14" fill="#9a3412">恢复执行：继续后 AI 从设计/执行恢复；调整返</text>
      <text x="876" y="1384" font-size="14" fill="#9a3412">回证据与候选；未答复等待；取消归档。</text>
    </g>
    <g id="node-design" data-kind="ai" data-row="6">
      <title>AI：设计或修复并执行 — 预设最低证据、反证/停止条件；先审查/sanity/预算 gate，再按冻结矩阵 run/queue。</title>
      <rect x="40" y="1492" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1516" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1542" font-size="18" font-weight="700">AI：设计或修复并执行</text>
      <text x="56" y="1566" font-size="14" fill="#334155">预设最低证据、反证/停止条件；先审查/sanity/</text>
      <text x="56" y="1586" font-size="14" fill="#334155">预算 gate，再按冻结矩阵 run/queue。</text>
    </g>
    <g id="node-coverage" data-kind="check" data-row="7">
      <title>AI：核对实跑覆盖与有效性 — 逐 claim 对照矩阵和全部 attempts，记录缺失/失败；决定性反证可早停，资源中止不等于无效。</title>
      <rect x="450" y="1692" width="360" height="134" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1716" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1742" font-size="18" font-weight="700">AI：核对实跑覆盖与有效性</text>
      <text x="466" y="1766" font-size="14" fill="#334155">逐 claim 对照矩阵和全部 attempts，记录缺失/</text>
      <text x="466" y="1786" font-size="14" fill="#334155">失败；决定性反证可早停，资源中止不等于无效</text>
      <text x="466" y="1806" font-size="14" fill="#334155">。</text>
    </g>
    <g id="node-learn" data-kind="ai" data-row="8">
      <title>AI：失败分层与启发留档 — FAILURE_ANALYSIS 保留事实、解释、待验证启发及下一项区分实验；method 失败不等于 idea 无效。</title>
      <rect x="40" y="1912" width="360" height="134" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1936" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1962" font-size="18" font-weight="700">AI：失败分层与启发留档</text>
      <text x="56" y="1986" font-size="14" fill="#334155">FAILURE_ANALYSIS 保留事实、解释、待验证启发</text>
      <text x="56" y="2006" font-size="14" fill="#334155">及下一项区分实验；method 失败不等于 idea 无</text>
      <text x="56" y="2026" font-size="14" fill="#334155">效。</text>
    </g>
    <g id="node-audit" data-kind="check" data-row="9">
      <title>AI：审查限定范围的结论 — 支持/部分支持/未支持/未定/范围内反证分别记录；审查身份和证据资格沿用原规则。</title>
      <rect x="450" y="2132" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="2156" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="2182" font-size="18" font-weight="700">AI：审查限定范围的结论</text>
      <text x="466" y="2206" font-size="14" fill="#334155">支持/部分支持/未支持/未定/范围内反证分别记</text>
      <text x="466" y="2226" font-size="14" fill="#334155">录；审查身份和证据资格沿用原规则。</text>
    </g>
    <g id="node-archive" data-kind="ai" data-row="10">
      <title>AI：归档判断与恢复点 — 保存旧新版本、语义 diff、负结果/启发索引及 next；科学配置变化新 cycle，保留失败 attempt。</title>
      <rect x="40" y="2332" width="360" height="134" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="2356" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="2382" font-size="18" font-weight="700">AI：归档判断与恢复点</text>
      <text x="56" y="2406" font-size="14" fill="#334155">保存旧新版本、语义 diff、负结果/启发索引及</text>
      <text x="56" y="2426" font-size="14" fill="#334155">next；科学配置变化新 cycle，保留失败 attemp</text>
      <text x="56" y="2446" font-size="14" fill="#334155">t。</text>
    </g>
    <g id="node-done" data-kind="terminal" data-row="11">
      <title>交接或暂停：保留证据边界 — 经审查的范围结论交 Writing Plan；暂停/取消归档不等于判定 idea 无效。</title>
      <rect x="450" y="2552" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="2576" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="2602" font-size="18" font-weight="700">交接或暂停：保留证据边界</text>
      <text x="466" y="2626" font-size="14" fill="#334155">经审查的范围结论交 Writing Plan；暂停/取消</text>
      <text x="466" y="2646" font-size="14" fill="#334155">归档不等于判定 idea 无效。</text>
    </g>
    <rect x="355.0" y="2487.0" width="140.0" height="17" rx="3" fill="#ffffff"/>
    <text x="425.0" y="2500.0" text-anchor="middle" font-size="12" fill="#64748b">交写作或保存暂停状态</text>
    <rect x="374.5" y="2267.0" width="101.0" height="17" rx="3" fill="#ffffff"/>
    <text x="425.0" y="2280.0" text-anchor="middle" font-size="12" fill="#64748b">审查后限定结论</text>
    <rect x="637.0" y="513.0" width="101.0" height="17" rx="3" fill="#ffffff"/>
    <text x="642.0" y="526.0" text-anchor="start" font-size="12" fill="#64748b">基线与状态一致</text>
    <rect x="348.5" y="1847.0" width="153.0" height="17" rx="3" fill="#ffffff"/>
    <text x="425.0" y="1860.0" text-anchor="middle" font-size="12" fill="#64748b">评估当前证据或停止依据</text>
    <rect x="566.5" y="1427.0" width="127.0" height="17" rx="3" fill="#ffffff"/>
    <text x="630.0" y="1440.0" text-anchor="middle" font-size="12" fill="#64748b">取消：归档当前证据</text>
    <rect x="553.5" y="1427.0" width="153.0" height="17" rx="3" fill="#ffffff"/>
    <text x="630.0" y="1440.0" text-anchor="middle" font-size="12" fill="#64748b">继续：在有效范围内执行</text>
