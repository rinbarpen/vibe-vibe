    <rect x="368.0" y="2067.0" width="114.0" height="17" rx="3" fill="#ffffff"/>
    <text x="425.0" y="2080.0" text-anchor="middle" font-size="12" fill="#64748b">负结果与启发分开</text>
    <rect x="778.0" y="933.0" width="114.0" height="17" rx="3" fill="#ffffff"/>
    <text x="835.0" y="946.0" text-anchor="middle" font-size="12" fill="#64748b">需要既有人工决定</text>
