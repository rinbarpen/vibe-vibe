    <rect x="637.0" y="313.0" width="159.5" height="17" rx="3" fill="#ffffff"/>
    <text x="642.0" y="326.0" text-anchor="start" font-size="12" fill="#64748b">读取源契约和 checkpoint</text>
    <rect x="1275" y="1364.0" width="140.0" height="17" rx="3" fill="#ffffff"/>
