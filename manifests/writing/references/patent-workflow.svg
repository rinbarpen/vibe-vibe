    <g id="node-start" data-kind="terminal" data-row="0">
      <title>请求 / 当前检查点 — 读取已有交底、文稿与账本；按全流程或单项任务进入。</title>
      <rect x="450" y="198" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="222" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="248" font-size="18" font-weight="700">请求 / 当前检查点</text>
      <text x="466" y="272" font-size="14" fill="#334155">读取已有交底、文稿与账本；按全流程或单项任</text>
      <text x="466" y="292" font-size="14" fill="#334155">务进入。</text>
    </g>
    <g id="node-intake" data-kind="ai" data-row="1">
      <title>核对交底与事实来源 — 复用已确定信息；标出技术事实缺口，不补造数据。</title>
      <rect x="40" y="398" width="360" height="188" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="422" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="448" font-size="18" font-weight="700">核对交底与事实来源</text>
      <text x="56" y="472" font-size="14" fill="#334155">复用已确定信息；标出技术事实缺口，不补造数</text>
      <text x="56" y="492" font-size="14" fill="#334155">据。</text>
    </g>
    <g id="node-facts" data-kind="human" data-row="1">
      <title>补充关键技术事实 — waiting-input：只暂停依赖该事实的起草，独立整理继续。</title>
      <rect x="860" y="398" width="360" height="188" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="422" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="448" font-size="18" font-weight="700">补充关键技术事实</text>
      <text x="876" y="472" font-size="14" fill="#334155">waiting-input：只暂停依赖该事实的起草，独立</text>
      <text x="876" y="492" font-size="14" fill="#334155">整理继续。</text>
      <text x="876" y="524" font-size="14" fill="#9a3412">介入条件：材料缺实现结构、步骤或效果依据。</text>
      <text x="876" y="544" font-size="14" fill="#9a3412">恢复执行：补充后回交底核对；取消则保留当前</text>
      <text x="876" y="564" font-size="14" fill="#9a3412">成果并归档。</text>
    </g>
    <g id="node-plan" data-kind="ai" data-row="2">
      <title>规划 / 权利要求支持矩阵 — 类型分析、必要/附加特征、术语、实施例及附图清单。</title>
      <rect x="40" y="672" width="360" height="208" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="696" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="722" font-size="18" font-weight="700">规划 / 权利要求支持矩阵</text>
      <text x="56" y="746" font-size="14" fill="#334155">类型分析、必要/附加特征、术语、实施例及附图</text>
      <text x="56" y="766" font-size="14" fill="#334155">清单。</text>
    </g>
    <g id="node-scope" data-kind="human" data-row="2">
      <title>保护范围与类型取舍 — waiting-decision：附具体规划版本、选项与影响，未回答不推进相关动作。</title>
      <rect x="860" y="672" width="360" height="208" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="696" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="722" font-size="18" font-weight="700">保护范围与类型取舍</text>
      <text x="876" y="746" font-size="14" fill="#334155">waiting-decision：附具体规划版本、选项与影</text>
      <text x="876" y="766" font-size="14" fill="#334155">响，未回答不推进相关动作。</text>
      <text x="876" y="798" font-size="14" fill="#9a3412">介入条件：有真实范围取舍、目标冲突或新增特</text>
      <text x="876" y="818" font-size="14" fill="#9a3412">征。</text>
      <text x="876" y="838" font-size="14" fill="#9a3412">恢复执行：同意后制作；调整回规划；取消则保</text>
      <text x="876" y="858" font-size="14" fill="#9a3412">留成果归档。</text>
    </g>
    <g id="node-figures" data-kind="ai" data-row="3">
      <title>绘制并核对所需附图 — chinese-patent-drawer / omnidraw；保留编辑源，核对中文、标记和路径。</title>
      <rect x="40" y="966" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="990" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1016" font-size="18" font-weight="700">绘制并核对所需附图</text>
      <text x="56" y="1040" font-size="14" fill="#334155">chinese-patent-drawer / omnidraw；保留编辑</text>
      <text x="56" y="1060" font-size="14" fill="#334155">源，核对中文、标记和路径。</text>
    </g>
    <g id="node-draft" data-kind="ai" data-row="4">
      <title>起草说明书 / 权利要求 / 摘要 — chinese-patent-writer；支持矩阵定位到正文、实施例、图与来源。</title>
      <rect x="40" y="1166" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1190" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1216" font-size="18" font-weight="700">起草说明书 / 权利要求 / 摘要</text>
      <text x="56" y="1240" font-size="14" fill="#334155">chinese-patent-writer；支持矩阵定位到正文、</text>
      <text x="56" y="1260" font-size="14" fill="#334155">实施例、图与来源。</text>
    </g>
    <g id="node-review" data-kind="check" data-row="4">
      <title>分轮审阅与内容复验 — chinese-patent-review；必须改清零，建议改有处置；记录真实审阅方式。</title>
      <rect x="450" y="1166" width="360" height="114" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1190" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1216" font-size="18" font-weight="700">分轮审阅与内容复验</text>
      <text x="466" y="1240" font-size="14" fill="#334155">chinese-patent-review；必须改清零，建议改有</text>
      <text x="466" y="1260" font-size="14" fill="#334155">处置；记录真实审阅方式。</text>
    </g>
    <g id="node-export" data-kind="ai" data-row="5">
      <title>导出 DOCX 草稿包 — 检测 Pandoc；从同版 HTML 和本地图导出，保存命令、退出状态及产物。</title>
      <rect x="40" y="1366" width="360" height="188" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1390" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1416" font-size="18" font-weight="700">导出 DOCX 草稿包</text>
      <text x="56" y="1440" font-size="14" fill="#334155">检测 Pandoc；从同版 HTML 和本地图导出，保存</text>
      <text x="56" y="1460" font-size="14" fill="#334155">命令、退出状态及产物。</text>
    </g>
    <g id="node-preview" data-kind="check" data-row="5">
      <title>重新打开并预览导出文件 — 核对中文、图文、公式和分页；缺预览则 pending，不冒充完成。</title>
      <rect x="450" y="1366" width="360" height="188" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
      <text x="466" y="1390" font-size="12" fill="#047857" font-weight="700">AI 判定 / 校验</text>
      <text x="466" y="1416" font-size="18" font-weight="700">重新打开并预览导出文件</text>
      <text x="466" y="1440" font-size="14" fill="#334155">核对中文、图文、公式和分页；缺预览则 pendin</text>
      <text x="466" y="1460" font-size="14" fill="#334155">g，不冒充完成。</text>
    </g>
    <g id="node-handback" data-kind="human" data-row="5">
      <title>按需确认交付版本 — waiting-decision：呈交清单、哈希、证据与未核实项；对外动作另立任务。</title>
      <rect x="860" y="1366" width="360" height="188" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="876" y="1390" font-size="12" fill="#c2410c" font-weight="700">人工决策</text>
      <text x="876" y="1416" font-size="18" font-weight="700">按需确认交付版本</text>
      <text x="876" y="1440" font-size="14" fill="#334155">waiting-decision：呈交清单、哈希、证据与未</text>
      <text x="876" y="1460" font-size="14" fill="#334155">核实项；对外动作另立任务。</text>
      <text x="876" y="1492" font-size="14" fill="#9a3412">介入条件：用户要求最终确认或准备对外动作。</text>
      <text x="876" y="1512" font-size="14" fill="#9a3412">恢复执行：确认后归档本地交付；修改回正文；</text>
      <text x="876" y="1532" font-size="14" fill="#9a3412">取消保留记录。</text>
    </g>
    <g id="node-rollback" data-kind="ai" data-row="6">
      <title>恢复指定工作前版 — 先备份当前版，再恢复同版文稿与图源；核对哈希后回审阅，更新账本。</title>
      <rect x="40" y="1640" width="360" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="56" y="1664" font-size="12" fill="#2563eb" font-weight="700">AI 执行</text>
      <text x="56" y="1690" font-size="18" font-weight="700">恢复指定工作前版</text>
      <text x="56" y="1714" font-size="14" fill="#334155">先备份当前版，再恢复同版文稿与图源；核对哈</text>
      <text x="56" y="1734" font-size="14" fill="#334155">希后回审阅，更新账本。</text>
    </g>
    <g id="node-end" data-kind="terminal" data-row="7">
      <title>归档 / 本轮结束 — 记录有效版本、证据与下一步；区分 delivered、单项结果与 cancelled，不宣称已申报。</title>
      <rect x="450" y="1840" width="360" height="114" rx="26" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
      <text x="466" y="1864" font-size="12" fill="#475569" font-weight="700">起点 / 交付</text>
      <text x="466" y="1890" font-size="18" font-weight="700">归档 / 本轮结束</text>
      <text x="466" y="1914" font-size="14" fill="#334155">记录有效版本、证据与下一步；区分 delivered</text>
      <text x="466" y="1934" font-size="14" fill="#334155">、单项结果与 cancelled，不宣称已申报。</text>
    </g>
    <text x="425.0" y="1156" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">草稿与矩阵齐备</text>
    <text x="425.0" y="1356" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">转换成功</text>
    <text x="835.0" y="620.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">取消本轮</text>
    <text x="232.0" y="1114.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">所需图通过 / 有据免图</text>
    <text x="835.0" y="1588.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">确认 / 取消均记录</text>
    <text x="630.0" y="388" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">缺关键事实</text>
    <text x="232.0" y="620.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">新稿 / 范围变化</text>
    <text x="425.0" y="620.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">仅审阅已有稿</text>
    <text x="425.0" y="914.0" text-anchor="middle" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">仅规划任务完成</text>
    <text x="232.0" y="914.0" text-anchor="start" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="4" paint-order="stroke">既有决定有效</text>
