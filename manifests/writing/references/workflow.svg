<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="2802" viewBox="0 0 1728 2802" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Writing · 标书编写工作流</title>
  <desc id="workflow-description">从招标要求与真实证据到逐章响应、验收和定稿。AI 负责执行与返工；新的业务取舍交由人决定；未答复等待，确认后 AI 恢复。 设计规范示意，不代表实时运行状态。左侧 AI 执行，中间 AI 判定与校验，右侧人工决策；橙色虚线表示返工。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker><marker id="rework-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect width="1728" height="2802" fill="#ffffff"/>
    <text x="28" y="38" font-size="26" font-weight="700">Writing · 标书编写工作流</text>
    <text x="28" y="70" font-size="14" fill="#475569">从招标要求与真实证据到逐章响应、验收和定稿。AI 负责执行与返工；新的业务取舍交由人决定；未答复等待，确认后 AI 恢复。</text>
    <text x="28" y="94" font-size="13" fill="#64748b">设计规范 · 静态流程示意，不代表执行状态 · 实线：正常流转；橙色虚线：返工</text>
    <rect x="20" y="128" width="400" height="2608" rx="14" fill="#f8faff" stroke="#e2e8f0"/>
    <text x="220" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 自主执行</text>
    <rect x="430" y="128" width="400" height="2608" rx="14" fill="#f6fbf9" stroke="#e2e8f0"/>
    <text x="630" y="157" text-anchor="middle" font-size="16" font-weight="700">AI 判定 / 校验与起止</text>
    <rect x="840" y="128" width="400" height="2608" rx="14" fill="#fffbf5" stroke="#e2e8f0"/>
    <text x="1040" y="157" text-anchor="middle" font-size="16" font-weight="700">人工决策门</text>
    <path data-from="archive" data-to="done" d="M 220.0,2480 V 2523.0 H 630.0 V 2566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
