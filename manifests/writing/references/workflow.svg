    <path data-from="release" data-to="archive" d="M 1040.0,2280 V 2323.0 H 220.0 V 2366" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path data-from="release" data-to="release" d="M 1220,2176.0 H 1238 V 2176.0 H 1220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
